name: Build Crimson Client

on:
  workflow_dispatch:
  push:
    paths:
      - 'CrimsonClient-Fabric-26.3-source.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Extract Crimson Client
        run: |
          mkdir -p source
          unzip -q CrimsonClient-Fabric-26.3-source.zip -d source

      - name: Build mod
        run: |
          cd source/CrimsonClient-Fabric-26.3
          gradle build

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CrimsonClient
          path: source/CrimsonClient-Fabric-26.3/build/libs/*.jar
